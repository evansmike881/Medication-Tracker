name: Validate

on:
  push:
  pull_request:
  schedule:
    - cron: "0 6 * * 1"

# These start as non-blocking so a validator opinion never makes the repo look broken.
# Remove `continue-on-error` once they pass cleanly.
jobs:
  hassfest:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: home-assistant/actions/hassfest@master

  hacs:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: hacs/action@main
        with:
          category: integration
