add_medication:
  name: Add medication
  description: Create or update a medication schedule for a person or pet. The integration options UI is the preferred admin flow, but services remain available for automations.
  fields:
    profile_id:
      required: true
      selector:
        text:
    profile_name:
      required: true
      selector:
        text:
    medication_id:
      required: true
      selector:
        text:
    medication_name:
      required: true
      selector:
        text:
    dosage:
      required: true
      selector:
        text:
    schedules:
      required: true
      example: ["08:00", "20:00"]
      selector:
        object:
    quantity:
      required: false
      selector:
        number:
          min: 0
          mode: box
    refill_at:
      required: false
      selector:
        number:
          min: 0
          mode: box
    notes:
      required: false
      selector:
        text:
    instructions:
      required: false
      selector:
        text:
    purpose:
      required: false
      selector:
        text:
    form:
      required: false
      selector:
        text:
    database_entry_id:
      required: false
      selector:
        text:
    nfc_tag_id:
      required: false
      selector:
        text:
    notification_enabled:
      required: false
      selector:
        boolean:
    notify_service:
      required: false
      example: notify.mobile_app_pixel_9
      selector:
        text:
    caregiver_name:
      required: false
      selector:
        text:
    caregiver_notify_service:
      required: false
      example: notify.mobile_app_family_phone
      selector:
        text:
    confirmation_required:
      required: false
      selector:
        boolean:
    reminder_minutes:
      required: false
      selector:
        number:
          min: 1
          mode: box
    missed_after_minutes:
      required: false
      selector:
        number:
          min: 1
          mode: box
    duplicate_guard_minutes:
      required: false
      selector:
        number:
          min: 0
          mode: box
log_dose:
  name: Log dose
  description: Record that a scheduled or manual dose has been taken.
  fields:
    medication_id:
      required: true
      selector:
        text:
    taken_at:
      required: false
      example: "2026-06-08T08:05:00+01:00"
      selector:
        text:
    source:
      required: false
      selector:
        text:
    confirmed_by:
      required: false
      selector:
        text:
    allow_duplicate:
      required: false
      selector:
        boolean:
remove_medication:
  name: Remove medication
  description: Remove a medication and its sensors.
  fields:
    medication_id:
      required: true
      selector:
        text:
refill_medication:
  name: Refill medication
  description: Increase the remaining quantity for a medication.
  fields:
    medication_id:
      required: true
      selector:
        text:
    quantity:
      required: true
      selector:
        number:
          min: 0
          mode: box
snooze_medication:
  name: Snooze medication
  description: Delay reminder notifications for a medication for a set number of minutes.
  fields:
    medication_id:
      required: true
      selector:
        text:
    minutes:
      required: true
      selector:
        number:
          min: 1
          max: 1440
          mode: box
skip_medication:
  name: Skip medication occurrence
  description: Mark the next or specified scheduled occurrence as intentionally skipped or held.
  fields:
    medication_id:
      required: true
      selector:
        text:
    scheduled_time:
      required: false
      example: "2026-06-12T20:00:00+01:00"
      selector:
        text:
