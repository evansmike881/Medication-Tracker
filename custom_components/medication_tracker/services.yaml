add_medication:
  name: Add medication
  description: Create or update a medication schedule for a person or pet. The integration options UI is the preferred admin flow, but services remain available for automations.
  fields:
    profile_id:
      required: true
      selector:
        text:
    profile_name:
      required: true
      selector:
        text:
    medication_id:
      required: true
      selector:
        text:
    medication_name:
      required: true
      selector:
        text:
    dosage:
      required: true
      selector:
        text:
    schedules:
      required: true
      example: ["08:00", "20:00"]
      selector:
        object:
    quantity:
      required: false
      selector:
        number:
          min: 0
          mode: box
    refill_at:
      required: false
      selector:
        number:
          min: 0
          mode: box
    notes:
      required: false
      selector:
        text:
    instructions:
      required: false
      selector:
        text:
    purpose:
      required: false
      selector:
        text:
    form:
      required: false
      selector:
        text:
    database_entry_id:
      required: false
      selector:
        text:
    nfc_tag_id:
      required: false
      selector:
        text:
    notification_enabled:
      required: false
      selector:
        boolean:
    notify_service:
      required: false
      example: notify.mobile_app_pixel_9
      selector:
        text:
    caregiver_name:
      required: false
      selector:
        text:
    caregiver_notify_service:
      required: false
      example: notify.mobile_app_family_phone
      selector:
        text:
    confirmation_required:
      required: false
      selector:
        boolean:
    reminder_minutes:
      required: false
      selector:
        number:
          min: 1
          mode: box
    missed_after_minutes:
      required: false
      selector:
        number:
          min: 1
          mode: box
    duplicate_guard_minutes:
      required: false
      selector:
        number:
          min: 0
          mode: box
    days_of_week:
      required: false
      description: Weekdays to take it, 0 = Monday ... 6 = Sunday. Leave empty for every day.
      example: [0, 2, 4]
      selector:
        object:
    repeat_every_minutes:
      required: false
      description: Re-send the reminder this often while it is still not taken (0 = never repeat).
      selector:
        number:
          min: 0
          max: 240
          mode: box
    max_repeats:
      required: false
      selector:
        number:
          min: 0
          max: 20
          mode: box
    end_date:
      required: false
      description: Last day of a course, e.g. 2026-12-31. Leave empty for no end.
      selector:
        date:
    as_needed:
      required: false
      description: As-needed medication with no fixed times (schedules can be empty).
      selector:
        boolean:
    max_doses_per_day:
      required: false
      description: For as-needed medication, the most doses allowed in a day (0 = no limit).
      selector:
        number:
          min: 0
          max: 48
          mode: box
    interval_days:
      required: false
      description: Take every N days (1 = daily, 2 = every other day, 7 = weekly).
      selector:
        number:
          min: 1
          max: 30
          mode: box
    anchor_date:
      required: false
      description: The first day of an every-N-days schedule.
      selector:
        date:
    escalate_after_minutes:
      required: false
      description: Tell the caregiver if the dose is still not taken this long after it was due (0 = off).
      selector:
        number:
          min: 0
          max: 1440
          mode: box

log_dose:
  name: Log dose
  description: Record that a scheduled or manual dose has been taken.
  fields:
    medication_id:
      required: true
      selector:
        text:
    taken_at:
      required: false
      example: "2026-06-08T08:05:00+01:00"
      selector:
        text:
    source:
      required: false
      selector:
        text:
    confirmed_by:
      required: false
      selector:
        text:
    allow_duplicate:
      required: false
      selector:
        boolean:
remove_medication:
  name: Remove medication
  description: Remove a medication and its sensors.
  fields:
    medication_id:
      required: true
      selector:
        text:
refill_medication:
  name: Refill medication
  description: Increase the remaining quantity for a medication.
  fields:
    medication_id:
      required: true
      selector:
        text:
    quantity:
      required: true
      selector:
        number:
          min: 0
          mode: box
snooze_medication:
  name: Snooze medication
  description: Delay reminder notifications for a medication for a set number of minutes.
  fields:
    medication_id:
      required: true
      selector:
        text:
    minutes:
      required: true
      selector:
        number:
          min: 1
          max: 1440
          mode: box
skip_medication:
  name: Skip medication occurrence
  description: Mark the next or specified scheduled occurrence as intentionally skipped or held.
  fields:
    medication_id:
      required: true
      selector:
        text:
    scheduled_time:
      required: false
      example: "2026-06-12T20:00:00+01:00"
      selector:
        text:

log_all_due:
  name: Mark all due as taken
  description: Log a dose for every medication that is currently due or overdue. Optionally limit it to one profile or specific medications.
  fields:
    profile_id:
      required: false
      selector:
        text:
    medication_ids:
      required: false
      selector:
        object:
    source:
      required: false
      default: manual
      selector:
        text:
    confirmed_by:
      required: false
      selector:
        text:

delete_dose:
  name: Delete logged dose
  description: Remove a dose that was logged by mistake. Gives the tablet back to the remaining quantity.
  fields:
    medication_id:
      required: true
      selector:
        text:
    taken_at:
      required: true
      description: The exact taken_at timestamp of the log entry (as shown in the History tab).
      selector:
        text:

reset_history:
  name: Reset history
  description: Start a medication's missed-dose history fresh from now (useful after a break).
  fields:
    medication_id:
      required: true
      selector:
        text:

update_settings:
  name: Update settings
  description: Change integration-wide settings.
  fields:
    default_notify_service:
      required: false
      description: Notify service used by any medication that has none of its own, e.g. notify.mobile_app_mike_s24.
      selector:
        text:
    fallback_notify_service:
      required: false
      selector:
        text:
    all_tag_ids:
      required: false
      description: NFC tag IDs that mark everything currently due as taken.
      selector:
        object:
    profile_tags:
      required: false
      description: Map of NFC tag ID to profile ID that marks that person's due medications as taken.
      selector:
        object:
    escalation_notify_service:
      required: false
      description: Who to tell when a dose is overdue and the medication has no caregiver phone of its own.
      selector:
        text:
    critical_notifications:
      required: false
      description: Use loud alarm-style phone notifications for due, missed and escalated doses (Android).
      selector:
        boolean:
    announce_service:
      required: false
      description: A notify service that speaks reminders aloud, e.g. notify.alexa_media_kitchen.
      selector:
        text:
    announce_only_when_home_entity:
      required: false
      description: Only announce when this person or device tracker is home.
      selector:
        entity:
          domain: [person, device_tracker]
    quiet_hours_start:
      required: false
      description: Start of quiet hours (HH:MM). No announcements and no refill reminders.
      selector:
        time:
    quiet_hours_end:
      required: false
      selector:
        time:

undo_last_dose:
  name: Undo last dose
  description: Remove the most recent logged dose of a medication and give the stock back.
  fields:
    medication_id:
      required: true
      selector:
        text:
