add_medication:
  name: Add medication
  description: Create or update a medication schedule for a person or pet. The integration options UI is the preferred admin flow, but services remain available for automations.
  fields:
    profile_id:
      required: true
      selector:
        text:
    profile_name:
      required: true
      selector:
        text:
    medication_id:
      required: true
      selector:
        text:
    medication_name:
      required: true
      selector:
        text:
    dosage:
      required: true
      selector:
        text:
    schedules:
      required: true
      example: ["08:00", "20:00"]
      selector:
        object:
    quantity:
      required: false
      selector:
        number:
          min: 0
          mode: box
    refill_at:
      required: false
      selector:
        number:
          min: 0
          mode: box
    notes:
      required: false
      selector:
        text:
    instructions:
      required: false
      selector:
        text:
    purpose:
      required: false
      selector:
        text:
    form:
      required: false
      selector:
        text:
    database_entry_id:
      required: false
      selector:
        text:
    nfc_tag_id:
      required: false
      selector:
        text:
    notification_enabled:
      required: false
      selector:
        boolean:
    notify_service:
      required: false
      example: notify.mobile_app_pixel_9
      selector:
        text:
    caregiver_name:
      required: false
      selector:
        text:
    caregiver_notify_service:
      required: false
      example: notify.mobile_app_family_phone
      selector:
        text:
    confirmation_required:
      required: false
      selector:
        boolean:
    reminder_minutes:
      required: false
      selector:
        number:
          min: 1
          mode: box
    missed_after_minutes:
      required: false
      selector:
        number:
          min: 1
          mode: box
    duplicate_guard_minutes:
      required: false
      selector:
        number:
          min: 0
          mode: box
    days_of_week:
      required: false
      description: Weekdays to take it, 0 = Monday ... 6 = Sunday. Leave empty for every day.
      example: [0, 2, 4]
      selector:
        object:
    repeat_every_minutes:
      required: false
      description: Re-send the reminder this often while it is still not taken (0 = never repeat).
      selector:
        number:
          min: 0
          max: 240
          mode: box
    max_repeats:
      required: false
      selector:
        number:
          min: 0
          max: 20
          mode: box

log_dose:
  name: Log dose
  description: Record that a scheduled or manual dose has been taken.
  fields:
    medication_id:
      required: true
      selector:
        text:
    taken_at:
      required: false
      example: "2026-06-08T08:05:00+01:00"
      selector:
        text:
    source:
      required: false
      selector:
        text:
    confirmed_by:
      required: false
      selector:
        text:
    allow_duplicate:
      required: false
      selector:
        boolean:
remove_medication:
  name: Remove medication
  description: Remove a medication and its sensors.
  fields:
    medication_id:
      required: true
      selector:
        text:
refill_medication:
  name: Refill medication
  description: Increase the remaining quantity for a medication.
  fields:
    medication_id:
      required: true
      selector:
        text:
    quantity:
      required: true
      selector:
        number:
          min: 0
          mode: box
snooze_medication:
  name: Snooze medication
  description: Delay reminder notifications for a medication for a set number of minutes.
  fields:
    medication_id:
      required: true
      selector:
        text:
    minutes:
      required: true
      selector:
        number:
          min: 1
          max: 1440
          mode: box
skip_medication:
  name: Skip medication occurrence
  description: Mark the next or specified scheduled occurrence as intentionally skipped or held.
  fields:
    medication_id:
      required: true
      selector:
        text:
    scheduled_time:
      required: false
      example: "2026-06-12T20:00:00+01:00"
      selector:
        text:

log_all_due:
  name: Mark all due as taken
  description: Log a dose for every medication that is currently due or overdue. Optionally limit it to one profile or specific medications.
  fields:
    profile_id:
      required: false
      selector:
        text:
    medication_ids:
      required: false
      selector:
        object:
    source:
      required: false
      default: manual
      selector:
        text:
    confirmed_by:
      required: false
      selector:
        text:

delete_dose:
  name: Delete logged dose
  description: Remove a dose that was logged by mistake. Gives the tablet back to the remaining quantity.
  fields:
    medication_id:
      required: true
      selector:
        text:
    taken_at:
      required: true
      description: The exact taken_at timestamp of the log entry (as shown in the History tab).
      selector:
        text:

reset_history:
  name: Reset history
  description: Start a medication's missed-dose history fresh from now (useful after a break).
  fields:
    medication_id:
      required: true
      selector:
        text:

update_settings:
  name: Update settings
  description: Change integration-wide settings.
  fields:
    default_notify_service:
      required: false
      description: Notify service used by any medication that has none of its own, e.g. notify.mobile_app_mike_s24.
      selector:
        text:
    fallback_notify_service:
      required: false
      selector:
        text:
    all_tag_ids:
      required: false
      description: NFC tag IDs that mark everything currently due as taken.
      selector:
        object:
    profile_tags:
      required: false
      description: Map of NFC tag ID to profile ID that marks that person's due medications as taken.
      selector:
        object:
