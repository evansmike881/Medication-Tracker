title: Medication Calendar
views:
  - title: Calendar
    path: medication-calendar
    cards:
      - type: heading
        heading: Medication Calendar
      - type: grid
        columns: 4
        square: false
        cards:
          - type: tile
            entity: sensor.medication_tracker_medication_count
            name: Medications
          - type: tile
            entity: sensor.medication_tracker_tracked_profiles
            name: People and pets
          - type: tile
            entity: sensor.medication_tracker_due_now_count
            name: Due now
          - type: tile
            entity: sensor.medication_tracker_next_due
            name: Next dose
      - type: custom:medication-tracker-weekly-card
        entity: sensor.medication_tracker_medication_registry
        title: Weekly Pill Box
        show_summary: true
        show_times: true
        show_dosage: true
        show_status_chip: true
        show_actions: true
        collapsible_items: true
        expand_today: true
      - type: calendar
        entities:
          - calendar.medication_tracker_schedule
        initial_view: dayGridMonth
      - type: markdown
        title: Seven-Day Schedule
        content: >-
          {% set rows = state_attr('sensor.medication_tracker_medication_registry', 'rows') or [] %}
          {% if not rows %}
          No medications are currently tracked.
          {% else %}
          {% set ns = namespace(items=[]) %}
          {% for row in rows %}
            {% for offset in range(0, 7) %}
              {% set target = now().date() + timedelta(days=offset) %}
              {% for schedule in row.schedules or [] %}
                {% set occurrence_key = target.strftime('%Y-%m-%dT') ~ schedule %}
                {% set status = row.schedule_statuses[occurrence_key] if row.schedule_statuses is defined and occurrence_key in row.schedule_statuses else 'On Track' %}
                {% set ns.items = ns.items + [{
                  'when': target.strftime('%Y-%m-%d ') ~ schedule,
                  'day_key': target.strftime('%Y-%m-%d'),
                  'day_label': target.strftime('%A %d %b'),
                  'time': schedule,
                  'profile': row.profile_name,
                  'medication': row.medication_name,
                  'dosage': row.dosage,
                  'status': status
                }] %}
              {% endfor %}
            {% endfor %}
          {% endfor %}
          {% for day in ns.items | groupby('day_key') %}
          ### {{ day.list[0].day_label }}
          | Time | Person or pet | Medication | Status |
          |---|---|---|---|
          {% for item in day.list | sort(attribute='time') %}
          | {{ item.time }} | {{ item.profile }} | {{ item.medication }} {{ item.dosage and '(' ~ item.dosage ~ ')' or '' }} | {{ item.status }} |
          {% endfor %}

          {% endfor %}
          {% endif %}
      - type: markdown
        title: Per-Medication Entities
        content: |
          Useful companion entities for calendar-style dashboards:
          - `sensor.<medication>_belongs_to`
          - `sensor.<medication>_next_dose`
          - `sensor.<medication>_last_dose`
          - `button.<medication>_log_dose`
          - `button.<medication>_test_due_notification`
          - `binary_sensor.<medication>_due_now`
